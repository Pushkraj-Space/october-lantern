name: Linux release bundle

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified Linux bundle to this repository's release
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    env:
      LANTERN_RELEASES_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            engine -> ../build/target
            desktop -> ../build/target
      - run: sudo apt-get update && sudo apt-get install -y tmux sqlite3 libgl1 libxkbcommon0 libwayland-client0
      - run: scripts/check.sh
      - run: scripts/build-app.sh
      - run: scripts/build-bus-linux.sh
      - run: python3 scripts/smoke-linux.py --bus
      - run: scripts/package-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: October-Lantern-linux-x86_64
          path: |
            build/October-Lantern-linux-x86_64.tar.gz
            build/October-Lantern-linux-x86_64.tar.gz.sha256
      - name: Publish when explicitly requested
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(python3 -c 'import tomllib; print(tomllib.load(open("engine/Cargo.toml", "rb"))["package"]["version"])')"
          notes="$(mktemp)"
          cat > "$notes" <<'NOTES'
          Native Linux Lantern: Rust desktop and engine sidecar, bundled October Bus,
          screenshots and shortcuts through desktop portals, local dictation support,
          and October account/phone controls. See the README for setup and verification limits.
          NOTES
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --target "$GITHUB_SHA" --title "October Lantern $tag" --notes-file "$notes"
          gh release upload "$tag" build/October-Lantern-linux-x86_64.tar.gz build/October-Lantern-linux-x86_64.tar.gz.sha256
          rm -f "$notes"
